# ──────────────────────────────────────────────────────────────────────────────
# NeuroAnimate — OrchestraGen Pipeline Configuration
# ──────────────────────────────────────────────────────────────────────────────
# This file centralises all tunable parameters for the six-model pipeline.
# Modify values here instead of editing source code directly.
# ──────────────────────────────────────────────────────────────────────────────

# ── Model Identifiers ────────────────────────────────────────────────────────
models:
  prompt_enhancer: "NousResearch/Nous-Hermes-2-Mistral-7B-DPO"
  sdxl_base: "stabilityai/stable-diffusion-xl-base-1.0"
  sdxl_refiner: "stabilityai/stable-diffusion-xl-refiner-1.0"
  liveportrait: "KwaiVGI/LivePortrait"
  esrgan_weights: "RealESRGAN_x2plus.pth"
  esrgan_url: "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth"

# ── GPU Assignment (Dynamic Memory Orchestration) ────────────────────────────
# Sequential load/unload strategy across dual NVIDIA T4 GPUs (16 GB each).
# Only one heavy model occupies VRAM at a time; GPU memory is explicitly
# cleared between stages to prevent OOM on consumer-grade hardware.
gpu:
  prompt_enhancer_device: 1        # Mistral 7B → GPU 1
  sdxl_base_device: 0              # SDXL Base → GPU 0
  sdxl_refiner_device: 1           # SDXL Refiner → GPU 1 (after Mistral unload)
  liveportrait_device: 0           # LivePortrait → GPU 0
  esrgan_dual_gpu: true            # Real-ESRGAN → split across GPU 0 + GPU 1
  target_vram_gb: 12.0             # ESRGAN auto-batch VRAM budget per GPU

# ── Prompt Enhancement (Mistral 7B) ─────────────────────────────────────────
prompt_enhancer:
  max_input_tokens: 180
  max_new_tokens: 90
  temperature: 0.7
  top_p: 0.9
  max_output_words: 77             # CLIP token limit for SDXL

# ── Image Generation (SDXL 1.0 Base + Refiner) ──────────────────────────────
image_generation:
  height: 768
  width: 768
  base_steps: 35
  base_guidance_scale: 8.0
  refiner_steps: 105
  refiner_guidance_scale: 8.0
  refiner_strength: 0.25

# ── Video Preprocessing ─────────────────────────────────────────────────────
video:
  target_width: 512
  target_height: 768
  fps: 25
  codec: "libx264"
  crf: 18

# ── LivePortrait (Face Animation) ───────────────────────────────────────────
liveportrait:
  motion_multiplier: 0.55
  scale: 3.0
  flag_relative_motion: true
  flag_pasteback: true
  flag_do_crop: true
  flag_lip_zero: false             # Patched to False to prevent lip freezing

# ── 2D Body Animation ───────────────────────────────────────────────────────
body_animation:
  breath_hz: 0.38
  breath_radial_px: 3.5
  breath_lift_px: 2.2
  sway_hz: 0.15
  sway_amp_px: 5.0
  shoulder_hz: 0.38
  shoulder_amp_px: 2.4
  random_jitter_amp: 0.25
  ar_alpha: 0.70
  ramp_frames: 20

# ── Composite (Face + Body Merge) ───────────────────────────────────────────
composite:
  fade_width_px: 80                # Feathered blend zone at shoulder split
  colour_correction_clamp: [0.80, 1.25]
  gaussian_blur_kernel: [1, 101]
  gaussian_blur_sigma: 30

# ── Real-ESRGAN Upscaling ───────────────────────────────────────────────────
esrgan:
  scale_factor: 1.5                # 1.5× (not full 2× — balances quality vs VRAM)
  output_crf: 16
  output_preset: "slow"
  vram_constant: 1.69e-6           # Empirical VRAM-per-pixel constant for auto-batching
  model_vram_gb: 0.5               # Base VRAM footprint of ESRGAN model
  max_batch_size: 48
